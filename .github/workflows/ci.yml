name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token for every job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (version in the comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/secret-scan.mjs # no API keys, tokens or private keys in tracked files
      - run: npm run build          # V1 into dist/; fails on any Squarespace CDN reference (V2 lives in its own repo)
      # Internal broken-link check. Fails until every nav page is migrated; made blocking at parity sign-off.
      - run: npm run check:links
        continue-on-error: true

  # Yondr Google sign-in (auth.overyondrdev.com): its own Worker in auth/. Unit tests for sessions and Google tokens.
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run check
      # Every site must use the same session verifier. (digital-ads-portal and christmass-cards check their copies in their own CI.)
      - run: |
          for f in ../src/worker/yondr-session.js; do
            cmp src/session.js "$f" || { echo "$f differs from auth/src/session.js"; exit 1; }
          done

# Deploys are handled by Cloudflare Workers Builds (Git integration), not by Actions,
# so no Cloudflare secrets are stored in GitHub.
