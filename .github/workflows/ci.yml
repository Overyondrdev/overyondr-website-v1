name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token for every job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pin third-party actions to a commit SHA before going live (Dependabot keeps them current).
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build          # V1 + V2 (v2/), merged into dist/; fails on any Squarespace CDN reference
      - run: npm run format:check --prefix v2
      - run: npm run check:links --prefix v2   # V2 internal links (blocking)
      # Internal broken-link check. Fails until every nav page is migrated; made blocking at parity sign-off.
      - run: npm run check:links
        continue-on-error: true

  # The ad portal (ads.overyondrdev.com) is its own Worker in ad-portal/. Type check, script syntax and a dry-run bundle.
  ad-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ad-portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ad-portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: for f in public/*.js; do node --check "$f"; done
      - run: npx wrangler -c wrangler.toml deploy --dry-run --outdir dist

  # Yondr Google sign-in (auth.overyondrdev.com): its own Worker in auth/. Unit tests for sessions and Google tokens.
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run check
      # Every site must use the same session verifier. (christmass-cards checks its copy in its own CI.)
      - run: |
          for f in ../src/worker/yondr-session.js ../ad-portal/src/yondr-session.js; do
            cmp src/session.js "$f" || { echo "$f differs from auth/src/session.js"; exit 1; }
          done

# Deploys are handled by Cloudflare Workers Builds (Git integration), not by Actions,
# so no Cloudflare secrets are stored in GitHub.
