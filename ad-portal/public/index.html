<!doctype html>
<!-- Yondr ad library: https://ads.overyondrdev.com (Worker yondr-ad-portal). App code: app.js; data: /api (src/index.ts). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Yondr display ads: preview, download, review and track where they run." />
  <meta name="theme-color" content="#FAFBF7" />
  <title>Ad library · Yondr</title>
  <link rel="icon" href="/brand/yondr-dark-green.svg" type="image/svg+xml" />
  <link rel="preload" href="/brand/fonts/fraunces-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/brand/fonts/inter-tight-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Yondr ad library, home">
        <img src="/brand/yondr-dark-green.svg" alt="Yondr" width="104" height="25" />
        <span>Ad library</span>
      </a>
      <div class="who">
        <label class="visually-hidden" for="set-picker">Ad set</label>
        <select id="set-picker" class="input" data-set-picker hidden></select>
        <button type="button" class="give" data-upload hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V8M7 13l5-5 5 5M4 4h16"/></svg>
          Upload ads
        </button>
        <span class="email" data-email title="Signed in"></span>
        <span class="pill role" data-role hidden></span>
        <a href="/cdn-cgi/access/logout">Sign out</a>
      </div>
    </div>
  </header>

  <main id="main"><div class="wrap">
    <section class="hero dark" aria-labelledby="lib-title" data-hero>
      <div class="hero-copy">
        <p class="eyebrow">Ad library</p>
        <h1 id="lib-title">Yondr ads, <em>ready to run.</em></h1>
        <p class="lede">Loading…</p>
      </div>
    </section>

    <div class="tabs" role="tablist" aria-label="Ad library">
      <button role="tab" id="tab-ads" aria-controls="panel-ads" aria-selected="true" data-tab="ads">Ads <span class="count" data-ad-count>0</span></button>
      <button role="tab" id="tab-campaigns" aria-controls="panel-campaigns" aria-selected="false" tabindex="-1" data-tab="campaigns">Campaigns <span class="count" data-campaign-count>0</span></button>
      <button role="tab" id="tab-copy" aria-controls="panel-copy" aria-selected="false" tabindex="-1" data-tab="copy">Copy &amp; specs</button>
      <button role="tab" id="tab-edit" aria-controls="panel-edit" aria-selected="false" tabindex="-1" data-tab="edit" hidden>Edit copy</button>
      <button role="tab" id="tab-people" aria-controls="panel-people" aria-selected="false" tabindex="-1" data-tab="people" hidden>People</button>
    </div>

    <div class="notice" data-notice hidden></div>

    <section id="panel-ads" role="tabpanel" aria-labelledby="tab-ads" data-panel="ads">
      <div class="toolbar" data-toolbar></div>
      <div data-grid aria-live="polite"><p class="loading">Loading ads…</p></div>
    </section>
    <section id="panel-campaigns" role="tabpanel" aria-labelledby="tab-campaigns" data-panel="campaigns" hidden></section>
    <section id="panel-copy" role="tabpanel" aria-labelledby="tab-copy" data-panel="copy" hidden></section>
    <section id="panel-edit" role="tabpanel" aria-labelledby="tab-edit" data-panel="edit" hidden></section>
    <section id="panel-people" role="tabpanel" aria-labelledby="tab-people" data-panel="people" hidden></section>
  </div></main>

  <footer class="site-foot">
    <div class="wrap"><div class="rule">
      <p class="tagline">Be Here Now</p>
      <small>© 2026 Yondr, Inc. · Internal. Please don’t share ads before they’re approved.</small>
      <nav aria-label="Footer"><a href="https://overyondrdev.com/">Website preview ↗</a></nav>
    </div></div>
  </footer>

  <div class="selbar" data-selbar hidden></div>
  <dialog class="sheet" data-detail aria-labelledby="detail-title"></dialog>
  <dialog class="sheet small" data-form aria-labelledby="form-title"></dialog>
  <div class="toast" role="status" aria-live="polite" data-toast></div>
  <script src="/render.js" defer></script>
  <script src="/editor.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
