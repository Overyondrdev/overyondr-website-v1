<!doctype html>
<!-- Help center for the Yondr ad library: ads.overyondrdev.com/help. Articles: help-content.js. App: help.js. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="How to use the Yondr ad library: find, download, edit and track ads." />
  <meta name="theme-color" content="#1C300B" />
  <meta name="view-transition" content="same-origin" />
  <title>Help center · Yondr ad library</title>
  <link rel="icon" href="/brand/yondr-dark-green.svg" type="image/svg+xml" />
  <link rel="preload" href="/brand/fonts/fraunces-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/brand/fonts/inter-tight-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="/help.css" />
</head>
<body class="hc">
  <a class="skip" href="#main">Skip to content</a>
  <header class="top hc-top">
    <div class="wrap">
      <a class="brand" href="/help" aria-label="Yondr help center, home">
        <img src="/brand/yondr-dark-green.svg" alt="Yondr" width="104" height="25" />
        <span>Help center</span>
      </a>
      <div class="who">
        <button type="button" class="hc-k" data-palette-open aria-keyshortcuts="Control+K Meta+K">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          Search <kbd data-kbd>Ctrl K</kbd>
        </button>
        <a href="/" class="give"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Ad library</a>
      </div>
    </div>
  </header>

  <main id="main"><div class="wrap" data-view aria-live="polite"></div></main>

  <footer class="site-foot">
    <div class="wrap"><div class="rule">
      <p class="tagline">Be Here Now</p>
      <small>© 2026 Yondr, Inc. · Internal.</small>
      <nav aria-label="Footer"><a href="/">Ad library</a><a href="/?tour=1">Take the tour</a></nav>
    </div></div>
  </footer>

  <dialog class="palette" data-palette aria-label="Search help">
    <div class="pal-in">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Search help… try “zip”, “edit headline”, “150 KB”" aria-label="Search help" autocomplete="off" spellcheck="false" data-pal-input role="combobox" aria-expanded="true" aria-controls="pal-list" />
      <kbd>Esc</kbd>
    </div>
    <ul id="pal-list" class="pal-list" role="listbox" data-pal-list></ul>
    <p class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span></p>
  </dialog>
  <div class="toast" role="status" aria-live="polite" data-toast></div>

  <script src="/help-content.js" defer></script>
  <script src="/help.js" defer></script>
</body>
</html>
