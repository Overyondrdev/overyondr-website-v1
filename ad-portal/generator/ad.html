<!doctype html>
<!--
  One display ad, in the V2 website style (Fraunces Soft + Instrument Sans, forest / lime / cream).
  render.mjs opens this file in Chromium, calls window.build(spec) and window.seek(seconds), and screenshots it.
  Three scenes: "in-use" (photo of students using the pouch), "stat" (the 1–2 weeks finding) and "pouch" (end card).
  Stills show one scene at rest; the motion version plays in-use → stat → pouch.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Fraunces'; src: url(fonts/fraunces-soft.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Instrument Sans'; src: url(fonts/instrument-sans.woff2) format('woff2'); font-weight: 400 700; }
  :root {
    --lime: #dcff6b; --forest: #1c2b0e; --forest-800: #24361a; --moss: #46583a; --cream: #f3f7d6; --sage: #b9c79a; --ink: #141811;
    --display: 'Fraunces', Georgia, serif; --sans: 'Instrument Sans', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  .ad { position: relative; overflow: hidden; background: var(--forest); color: var(--cream); font-family: var(--sans);
        -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .scene { position: absolute; inset: 0; overflow: hidden; background: var(--forest); }
  .scene > * { position: absolute; }
  .disp { font-family: var(--display); font-variation-settings: 'SOFT' 100; font-weight: 500; letter-spacing: -0.015em; line-height: 1.02; text-wrap: balance; }
  .hl em { font-style: normal; color: var(--lime); }
  .logo { color: var(--cream); line-height: 0; }
  .logo svg { width: 100%; height: auto; display: block; }
  .eyebrow { font: 700 10px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--lime); white-space: nowrap; }
  .eyebrow.pill { background: var(--lime); color: var(--forest); padding: 6px 9px 5px; border-radius: 999px; }
  .cta { display: inline-flex; align-items: center; gap: .45em; background: var(--lime); color: var(--forest); border-radius: 999px;
         font-family: var(--display); font-variation-settings: 'SOFT' 100; font-weight: 650; white-space: nowrap; line-height: 1; }
  .cta svg { width: 1em; height: 1em; flex: none; }
  .desc { font: 400 13px/1.3 var(--sans); color: var(--cream); text-wrap: pretty; }
  .src { font: 400 8px/1.2 var(--sans); color: var(--sage); opacity: .9; }
  .statline { font: 600 13px/1.2 var(--sans); color: var(--cream); }
  .statline b { color: var(--lime); font-weight: 700; }
  .big { font-family: var(--display); font-variation-settings: 'SOFT' 100; font-weight: 500; color: var(--lime); line-height: .8; letter-spacing: -0.04em; white-space: nowrap; }
  .unit { font-family: var(--display); font-variation-settings: 'SOFT' 100; font-weight: 400; color: var(--cream); line-height: 1.05; text-wrap: balance; }
  .note { font: 600 10px/1.25 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--sage); }
  .photo { inset: 0; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .feather { pointer-events: none; }
  .blob { background: var(--lime); border-radius: 22px; }
  .pouch img { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 14px rgb(0 0 0 / .35)); }
  .wipe { position: absolute; inset: 0; background: var(--lime); z-index: 10; transform: translateX(-101%); }
  .hl .w { display: inline-block; }

  /* ================================================================ 300 x 250 (336 x 280 is this layout at 1.12x) */
  .s300x250 .in-use .photo { inset: 0 0 auto 0; height: 160px; }
  .s300x250 .in-use .feather { left: 0; right: 0; top: 90px; height: 72px; background: linear-gradient(rgb(28 43 14 / 0), var(--forest)); }
  .s300x250 .scrim { left: 0; right: 0; top: 0; height: 56px; background: linear-gradient(rgb(28 43 14 / .75), rgb(28 43 14 / 0)); }
  .s300x250 .in-use .logo { left: 14px; top: 14px; width: 66px; }
  .s300x250 .in-use .eyebrow { right: 12px; top: 11px; }
  .s300x250 .in-use .hl { left: 16px; top: 146px; width: 268px; height: 58px; font-size: 27px; }
  .s300x250 .in-use .cta { left: 16px; bottom: 14px; height: 28px; padding: 0 13px; font-size: 13px; }
  .s300x250 .in-use .src { right: 14px; bottom: 16px; width: 96px; text-align: right; }

  .s300x250 .stat .logo { left: 16px; top: 16px; width: 62px; }
  .s300x250 .stat .big { left: 14px; top: 50px; font-size: 100px; }
  .s300x250 .stat .unit { left: 17px; top: 136px; width: 170px; height: 54px; font-size: 22px; }
  .s300x250 .stat .note { left: 17px; top: 200px; width: 170px; }
  .s300x250 .stat .blob { left: 206px; top: 60px; width: 150px; height: 240px; border-radius: 26px; }
  .s300x250 .stat .pouch { left: 192px; top: 26px; width: 96px; transform: rotate(-7deg); }

  .s300x250 .pouch-sc .logo { left: 16px; top: 16px; width: 62px; }
  .s300x250 .pouch-sc .eyebrow { left: 16px; top: 46px; }
  .s300x250 .pouch-sc .hl { left: 16px; top: 64px; width: 172px; height: 92px; font-size: 27px; }
  .s300x250 .pouch-sc .statline { left: 16px; top: 162px; width: 172px; font-size: 12px; }
  .s300x250 .pouch-sc .cta { left: 16px; bottom: 16px; height: 28px; padding: 0 13px; font-size: 13px; }
  .s300x250 .pouch-sc .blob { left: 206px; top: 60px; width: 150px; height: 240px; border-radius: 26px; }
  .s300x250 .pouch-sc .pouch { left: 192px; top: 26px; width: 96px; transform: rotate(-7deg); }

  /* ================================================================ 728 x 90 */
  .s728x90 .logo { left: 22px; top: 37px; width: 76px; }
  .s728x90 .in-use .photo { left: 118px; right: auto; width: 196px; }
  .s728x90 .in-use .feather { left: 234px; top: 0; width: 81px; height: 90px; background: linear-gradient(90deg, rgb(28 43 14 / 0), var(--forest)); }
  .s728x90 .in-use .eyebrow.pill { background: none; color: var(--lime); padding: 0; left: 318px; top: 21px; }
  .s728x90 .in-use .feather.l { left: 118px; width: 40px; background: linear-gradient(90deg, var(--forest), rgb(28 43 14 / 0)); }
  .s728x90 .eyebrow { left: 360px; top: 18px; }
  .s728x90 .in-use .hl { left: 318px; top: 36px; width: 226px; height: 30px; font-size: 25px; white-space: nowrap; }
  .s728x90 .in-use .statline { left: 318px; top: 66px; }
  .s728x90 .cta { right: 18px; top: 29px; height: 32px; padding: 0 15px; font-size: 14px; }
  .s728x90 .src { display: none; }

  .s728x90 .stat .big { left: 136px; top: 22px; font-size: 62px; }
  .s728x90 .stat .eyebrow { display: none; }
  .s728x90 .stat .unit { left: 246px; top: 17px; width: 186px; height: 56px; font-size: 23px; }
  .s728x90 .stat .blob { left: 448px; top: 14px; width: 112px; height: 112px; border-radius: 999px; }
  .s728x90 .stat .pouch { left: 470px; top: 6px; width: 58px; transform: rotate(-12deg); }

  .s728x90 .pouch-sc .eyebrow { left: 136px; top: 17px; }
  .s728x90 .pouch-sc .hl { left: 136px; top: 32px; width: 296px; height: 28px; font-size: 25px; white-space: nowrap; }
  .s728x90 .pouch-sc .statline { left: 136px; top: 64px; width: 300px; font-size: 12px; }
  .s728x90 .pouch-sc .blob { left: 448px; top: 14px; width: 112px; height: 112px; border-radius: 999px; }
  .s728x90 .pouch-sc .pouch { left: 470px; top: 6px; width: 58px; transform: rotate(-12deg); }

  /* ================================================================ 320 x 50 */
  .s320x50 .logo { left: 8px; top: 20px; width: 45px; }
  .s320x50 .eyebrow, .s320x50 .src, .s320x50 .note, .s320x50 .desc { display: none; }
  .s320x50 .cta { right: 6px; top: 11px; height: 28px; padding: 0 10px; font-size: 12.5px; }
  .s320x50 .cta svg { display: none; }  /* "Learn more" needs the room */
  .s320x50 .in-use .photo { left: 58px; right: auto; width: 50px; }
  .s320x50 .in-use .hl, .s320x50 .pouch-sc .hl { line-height: 1.05; }
  .s320x50 .hl .in, .s320x50 .unit .in { display: block; width: 100%; }
  .s320x50 .in-use .feather { left: 84px; top: 0; width: 25px; height: 50px; background: linear-gradient(90deg, rgb(28 43 14 / 0), var(--forest)); }
  .s320x50 .in-use .feather.l { left: 58px; width: 10px; background: linear-gradient(90deg, var(--forest), rgb(28 43 14 / 0)); }
  .s320x50 .in-use .hl { left: 113px; top: 6px; width: 104px; height: 38px; font-size: 16px; display: flex; align-items: center; }
  .s320x50 .stat .big { left: 62px; top: 12px; font-size: 32px; }
  .s320x50 .stat .unit { left: 122px; top: 7px; width: 104px; height: 36px; font-size: 15px; display: flex; align-items: center; }
  .s320x50 .stat .blob, .s320x50 .stat .pouch { display: none; }
  .s320x50 .pouch-sc .hl { left: 62px; top: 6px; width: 108px; height: 38px; font-size: 16px; display: flex; align-items: center; }
  .s320x50 .pouch-sc .statline { display: none; }
  .s320x50 .pouch-sc .blob { left: 174px; top: 4px; width: 46px; height: 46px; border-radius: 999px; }
  .s320x50 .pouch-sc .pouch { left: 181px; top: 2px; width: 29px; transform: rotate(-12deg); }
  .s320x50 .pouch-sc .pouch img { filter: drop-shadow(0 3px 4px rgb(0 0 0 / .35)); }

  /* ================================================================ 300 x 600 */
  .s300x600 .logo { left: 22px; top: 22px; width: 84px; }
  .s300x600 .scrim { left: 0; right: 0; top: 0; height: 80px; background: linear-gradient(rgb(28 43 14 / .7), rgb(28 43 14 / 0)); }
  .s300x600 .in-use .photo { inset: 0 0 auto 0; height: 318px; }
  .s300x600 .in-use .feather { left: 0; right: 0; top: 218px; height: 101px; background: linear-gradient(rgb(28 43 14 / 0), var(--forest)); }
  .s300x600 .in-use .eyebrow { right: 18px; top: 22px; }
  .s300x600 .in-use .hl { left: 22px; top: 300px; width: 256px; height: 118px; font-size: 40px; }
  .s300x600 .in-use .desc { left: 22px; top: 428px; width: 250px; height: 66px; font-size: 14.5px; }
  .s300x600 .cta { left: 22px; bottom: 44px; height: 40px; padding: 0 18px; font-size: 16px; }
  .s300x600 .src { left: 22px; bottom: 18px; width: 256px; }

  .s300x600 .stat .eyebrow { left: 22px; top: 80px; }
  .s300x600 .stat .big { left: 18px; top: 112px; font-size: 150px; }
  .s300x600 .stat .unit { left: 22px; top: 238px; width: 250px; height: 66px; font-size: 30px; }
  .s300x600 .stat .note { left: 22px; top: 312px; width: 250px; font-size: 11px; }
  .s300x600 .stat .blob { left: 60px; top: 424px; width: 220px; height: 220px; border-radius: 999px; }
  .s300x600 .stat .pouch { left: 98px; top: 396px; width: 118px; transform: rotate(-6deg); }
  .s300x600 .stat .cta, .s300x600 .stat .src { display: none; }

  .s300x600 .pouch-sc .eyebrow { left: 22px; top: 76px; }
  .s300x600 .pouch-sc .hl { left: 22px; top: 96px; width: 256px; height: 118px; font-size: 40px; }
  .s300x600 .pouch-sc .statline { left: 22px; top: 222px; width: 256px; font-size: 14px; }
  .s300x600 .pouch-sc .desc { left: 22px; top: 248px; width: 256px; height: 56px; font-size: 13.5px; color: var(--sage); }
  .s300x600 .pouch-sc .cta { top: 318px; bottom: auto; }
  .s300x600 .pouch-sc .src { top: 368px; bottom: auto; }
  .s300x600 .pouch-sc .blob { left: 60px; top: 424px; width: 220px; height: 220px; border-radius: 999px; }
  .s300x600 .pouch-sc .pouch { left: 98px; top: 396px; width: 118px; transform: rotate(-6deg); }

  /* ================================================================ 160 x 600 */
  .s160x600 .logo { left: 16px; top: 18px; width: 68px; }
  .s160x600 .scrim { left: 0; right: 0; top: 0; height: 64px; background: linear-gradient(rgb(28 43 14 / .7), rgb(28 43 14 / 0)); }
  .s160x600 .in-use .photo { inset: 0 0 auto 0; height: 290px; }
  .s160x600 .in-use .feather { left: 0; right: 0; top: 200px; height: 91px; background: linear-gradient(rgb(28 43 14 / 0), var(--forest)); }
  .s160x600 .eyebrow { font-size: 9px; }
  .s160x600 .in-use .eyebrow { left: 16px; top: 262px; }
  .s160x600 .in-use .hl { left: 16px; top: 284px; width: 130px; height: 130px; font-size: 27px; }
  .s160x600 .in-use .desc { left: 16px; top: 424px; width: 130px; height: 92px; font-size: 12.5px; }
  .s160x600 .cta { left: 16px; bottom: 34px; height: 32px; padding: 0 12px; font-size: 12.5px; }
  .s160x600 .src { left: 16px; bottom: 12px; width: 130px; font-size: 7.5px; }

  .s160x600 .stat .eyebrow { left: 16px; top: 66px; }
  .s160x600 .stat .big { left: 13px; top: 86px; font-size: 92px; }
  .s160x600 .stat .unit { left: 16px; top: 160px; width: 130px; height: 78px; font-size: 24px; }
  .s160x600 .stat .note { left: 16px; top: 240px; width: 130px; font-size: 9.5px; }
  .s160x600 .stat .blob { left: 44px; top: 336px; width: 140px; height: 140px; border-radius: 999px; }
  .s160x600 .stat .pouch { left: 30px; top: 272px; width: 100px; transform: rotate(-7deg); }
  .s160x600 .stat .cta, .s160x600 .stat .src { display: none; }

  .s160x600 .pouch-sc .eyebrow { left: 16px; top: 62px; }
  .s160x600 .pouch-sc .hl { left: 16px; top: 82px; width: 132px; height: 130px; font-size: 27px; }
  .s160x600 .pouch-sc .statline { left: 16px; top: 222px; width: 130px; font-size: 12.5px; }
  .s160x600 .pouch-sc .blob { left: 44px; top: 336px; width: 140px; height: 140px; border-radius: 999px; }
  .s160x600 .pouch-sc .pouch { left: 30px; top: 272px; width: 100px; transform: rotate(-7deg); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const LOGO = '<svg viewBox="0 0 864 203.54" fill="currentColor" aria-label="Yondr"><path d="M475.64,99.62L413.55,3.91h-56.29v77.5C348.27,33.19,307.36,0,253.76,0,217.01,0,186.22,15.61,167.59,40.97L187.04,3.91h-63.38l-30.14,68.15L63.38,3.91H0l65.35,124.55v71.15h56.33v-71.15l32.55-62.02c-3.78,10.86-5.82,22.72-5.82,35.32,0,59,44.51,101.78,105.36,101.78,53.59,0,94.51-33.19,103.5-81.42v77.51h56.33v-95.66l62.05,95.66h56.33V3.91h-56.33v95.69h0ZM253.76,150.42c-27.05,0-46.76-20.42-46.76-48.65s19.72-48.65,46.76-48.65,46.76,20.42,46.76,48.65-19.72,48.65-46.76,48.65ZM825.09,116.59c20.56-8.11,32.12-25.72,32.12-50.05,0-38.29-28.17-62.62-72.39-62.62h-71.55v79.42c-7.77-48.14-46.33-79.42-100.53-79.42h-67.27v195.71h67.27c54.21,0,92.76-31.29,100.53-79.44v79.44h56.34v-62.62c24.23,5.02,39.16,28.23,38.03,62.62h56.33c.85-39.14-12.38-68.21-38.86-83.03h0ZM609.34,150.42h-7.56V53.12h7.56c27.89,0,46.76,19.58,46.76,48.65s-18.88,48.65-46.76,48.65ZM780.95,83.44h-11.36v-33.82h11.36c9.41,0,17.04,7.57,17.04,16.91s-7.63,16.91-17.04,16.91h0Z"/></svg>';
const ARROW = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// Where the pouch sits in each photo, per ad shape (object-position).
const FOCUS = {
  hands: { wide: '62% 58%', tall: '60% 50%', narrow: '58% 50%', box: '58% 45%' },
  desk: { wide: '64% 66%', tall: '66% 50%', narrow: '64% 50%', box: '62% 58%' },
};

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
// Headline: wrap each word for the motion reveal and colour "Yondr" lime.
const headline = (t) => '<span class="in">' + t.split(' ').map((w) => `<span class="w">${/Yondr/.test(w) ? '<em>' + esc(w) + '</em>' : esc(w)}</span>`).join(' ') + '</span>';

let T = [];   // animated elements: { el, at, dur, kind }
let SCENES = [];
let WIPES = [];

window.build = async function (spec) {
  const { c, size, h, view, base } = spec;      // c = campaign.json, h = headline entry
  const layout = size.id === '336x280' ? '300x250' : size.id;
  const scale = size.id === '336x280' ? 1.12 : 1;
  const shape = size.w / size.h > 3 ? 'wide' : size.h / size.w > 3 ? 'narrow' : size.h > size.w ? 'tall' : 'box';
  const photo = base + c.photos[h.photo].src;
  const pouch = base + c.pouch.src;
  const cta = (size.id === '320x50' ? c.ctaShort : c.cta) + ' ' + ARROW;
  const lw = scale === 1 ? size.w : 300, lh = scale === 1 ? size.h : 250;

  const root = document.getElementById('root');
  root.innerHTML = `
  <div class="ad s${layout}" style="width:${size.w}px;height:${size.h}px">
    <div class="stage" style="width:${lw}px;height:${lh}px;transform:scale(${scale})">
      <section class="scene in-use" data-scene="in-use">
        <div class="photo"><img src="${photo}" alt="" style="object-position:${FOCUS[h.photo][shape]}"></div>
        <div class="feather"></div><div class="feather l"></div><div class="scrim"></div>
        <div class="logo">${LOGO}</div>
        <div class="eyebrow pill">${esc(c.eyebrow)}</div>
        <h1 class="hl disp" data-a="0.3,0.25,words" data-fit>${headline(h.text)}</h1>
        <p class="statline" data-a="1.0,0.35,sweep"><b>+${esc(c.stat.big)} weeks</b> of learning a year</p>
        <p class="desc" data-a="1.2,0.5,sweep" data-fit>${esc(h.desc)}</p>
        <div class="cta" data-a="1.6,0.3,sweep">${cta}</div>
        <p class="src" data-a="1.6,0.3,sweep">${esc(size.w >= 300 && size.h >= 600 ? c.source : c.sourceShort)}</p>
      </section>
      <section class="scene stat" data-scene="stat">
        <div class="blob"></div>
        <div class="pouch"><img src="${pouch}" alt=""></div>
        <div class="logo">${LOGO}</div>
        <div class="eyebrow" data-a="0.1,0.3,sweep">${esc(c.eyebrow)}</div>
        <div class="big" data-a="0.25,0.4,lift">${esc(c.stat.big)}</div>
        <div class="unit" data-a="0.6,0.45,sweep" data-fit>${esc(c.stat.unit)}</div>
        <div class="note" data-a="1.0,0.35,sweep">${esc(c.stat.note)}</div>
        <div class="cta">${cta}</div>
        <p class="src">${esc(c.sourceShort)}</p>
      </section>
      <section class="scene pouch-sc" data-scene="pouch">
        <div class="blob"></div>
        <div class="pouch"><img src="${pouch}" alt=""></div>
        <div class="logo">${LOGO}</div>
        <div class="eyebrow" data-a="0.05,0.3,sweep">${esc(c.eyebrow)}</div>
        <h1 class="hl disp" data-a="0.15,0.25,words" data-fit>${headline(h.text)}</h1>
        <p class="statline" data-a="0.9,0.35,sweep"><b>+${esc(c.stat.big)} weeks</b> of learning a year</p>
        <p class="desc" data-a="1.1,0.5,sweep" data-fit>${esc(h.desc)}</p>
        <div class="cta" data-a="1.4,0.3,sweep">${cta}</div>
        <p class="src" data-a="1.4,0.3,sweep">${esc(size.w >= 300 && size.h >= 600 ? c.source : c.sourceShort)}</p>
      </section>
      <div class="wipe"></div>
    </div>
  </div>`;

  await document.fonts.load("500 20px Fraunces"); await document.fonts.load("650 20px Fraunces"); await document.fonts.load("400 20px Fraunces");
  await document.fonts.load("400 20px 'Instrument Sans'"); await document.fonts.load("700 20px 'Instrument Sans'"); await document.fonts.ready;
  await Promise.all([...root.querySelectorAll('img')].map((i) => i.decode().catch(() => {})));
  // Remove elements a layout hides, so the fit pass ignores them.
  root.querySelectorAll('.scene > *').forEach((el) => { if (getComputedStyle(el).display === 'none' || !hasBox(el)) el.remove(); });
  // Shrink text until it fits its box.
  root.querySelectorAll('[data-fit]').forEach(fit);

  const SC = (name) => root.querySelector(`[data-scene="${name}"]`);
  if (view === 'motion') {
    // The stat and end scenes share the pouch, so the second change swaps only the words (no wipe).
    SCENES = [{ el: SC('in-use'), from: 0, to: 3.9 }, { el: SC('stat'), from: 3.9, to: 8.1, exit: true }, { el: SC('pouch'), from: 8.1, to: 1e9 }];
    WIPES = [3.9];
  } else {
    const only = view === 'in-use' ? 'in-use' : 'pouch';
    SCENES = [{ el: SC(only), from: -1e9, to: 1e9, still: true }];
    root.querySelectorAll('.scene').forEach((s) => { if (s !== SC(only)) s.remove(); });
    WIPES = [];
  }
  T = [];
  for (const s of SCENES) {
    s.el.querySelectorAll('[data-a]').forEach((el) => {
      const [at, dur, kind] = el.dataset.a.split(',');
      T.push({ el, scene: s, at: s.from + (+at), dur: +dur, kind, base: el.style.transform || getComputedStyle(el).transform });
    });
  }
  window.seek(view === 'motion' ? 0 : 1e6);
  return { duration: 13.5 };
};

// An element only shows where the size's layout positions it (desc, source etc. are optional on small sizes).
function hasBox(el) {
  for (const sheet of document.styleSheets) for (const r of sheet.cssRules) {
    if (r.selectorText && (r.style.top || r.style.bottom || r.style.inset) && el.matches(r.selectorText)) return true;
  }
  return false;
}

function fit(el) {
  let size = parseFloat(getComputedStyle(el).fontSize);
  const maxH = el.clientHeight, maxW = el.clientWidth;
  el.style.height = 'auto';
  if (getComputedStyle(el).display === 'flex') el.style.minHeight = maxH + 'px';
  const tooBig = () => el.scrollHeight > maxH + 1 || el.scrollWidth > maxW + 1;
  while (tooBig() && size > 8) { size -= 0.5; el.style.fontSize = size + 'px'; }
  el.style.height = maxH + 'px';
}

const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 4);
const easeInOut = (x) => { x = Math.min(1, Math.max(0, x)); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

// Motion is built from masked sweeps: text never moves, a mask uncovers it. Each GIF frame then only
// re-encodes the newly uncovered strip, which keeps the animated ads under 150 KB.
const clipX = (p) => p >= 1 ? 'none' : `inset(-30% ${((1 - p) * 104).toFixed(2)}% -30% -4%)`;
const clipUp = (p) => p >= 1 ? 'none' : `inset(${((1 - p) * 100).toFixed(2)}% -6% -12% -6%)`;
const clipOut = (q) => `inset(-30% -4% -30% ${(q * 104).toFixed(2)}%)`;

window.seek = function (t) {
  for (const s of SCENES) s.el.style.visibility = t >= s.from && t < s.to ? 'visible' : 'hidden';
  // Lime wipe: covers 0.45 s before the scene change, uncovers 0.45 s after.
  const wipe = document.querySelector('.wipe');
  let x = -101;
  for (const w of WIPES) {
    if (t >= w - 0.45 && t < w) x = -101 + 101 * easeInOut((t - (w - 0.45)) / 0.45);
    else if (t >= w && t < w + 0.45) x = 101 * easeInOut((t - w) / 0.45);
  }
  if (wipe) wipe.style.transform = `translateX(${x}%)`;
  for (const a of T) {
    const delay = WIPES.includes(a.scene.from) ? 0.3 : 0; // let the wipe clear first
    const p = a.scene.still ? 1 : ease((t - a.at - delay) / a.dur);
    const el = a.el;
    if (a.kind === 'sweep') el.style.clipPath = clipX(p);
    else if (a.kind === 'lift') el.style.clipPath = clipUp(p);
    else if (a.kind === 'words') {
      el.querySelectorAll('.w').forEach((w, i) => {
        const q = a.scene.still ? 1 : ease((t - a.at - delay - i * 0.13) / a.dur);
        w.style.clipPath = clipX(q);
      });
    }
    // Scenes without a wipe after them sweep their words out over the last 0.4 s.
    if (a.scene.exit && t >= a.scene.to - 0.4 && t < a.scene.to) {
      const q = easeInOut((t - (a.scene.to - 0.4)) / 0.4);
      el.style.clipPath = clipOut(q);
      el.querySelectorAll('.w').forEach((w) => { w.style.clipPath = 'none'; });
    }
  }
};
</script>
</body>
