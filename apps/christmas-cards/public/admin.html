<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Card Team Admin · Yondr Christmas Cards</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/app.css" />
  <script type="module" src="/admin.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/admin" aria-label="Card team admin">
      <img src="/brand/yondr-off-white.svg" alt="Yondr" width="84" height="20" />
      <span>Christmas Cards · Admin</span>
    </a>
    <nav class="top-right">
      <a class="pill-link" href="/">My list</a>
      <span class="who" data-who></span>
      <button class="signout" type="button" data-signout hidden>Sign out</button>
    </nav>
  </header>
  <main class="admin-wrap" data-root><div class="spinner" role="status" aria-label="Loading"></div></main>
  <div class="toasts" aria-live="polite" data-toasts></div>
</body>
</html>
